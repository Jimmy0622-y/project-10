<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>股票更新結果</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-900 text-white min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-4xl font-bold mb-8 text-emerald-400">
        股票清單更新結果
      </h1>

      <div class="space-y-4">
        {% for item in results %}

        <div class="bg-gray-800 rounded-xl border border-gray-700 p-6">
          <div class="flex justify-between items-center">
            <div>
              <h2 class="text-2xl font-bold">
                {{ item.symbol }}
              </h2>
            </div>

            <div>
              {% if "成功" in item.status %}
              <span
                class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm"
              >
                {{ item.status }}
              </span>

              {% else %}

              <span
                class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm"
              >
                {{ item.status }}
              </span>

              {% endif %}
            </div>
          </div>
        </div>

        {% endfor %}
      </div>

      <div class="mt-10">
        <a
          href="/"
          class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl font-bold"
        >
          返回首頁
        </a>
      </div>
    </div>
  </body>
</html>
