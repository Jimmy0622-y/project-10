<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>交易策略模擬系統</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
      <!-- Header -->
      <header class="text-center mb-10">
        <h1
          class="text-4xl font-bold mb-4 bg-gradient-to-r from-emerald-400 to-blue-400 bg-clip-text text-transparent"
        >
          交易模擬系統
        </h1>
        <p class="text-gray-400 text-sm">逐日模擬 + 即時交易操作</p>
      </header>

      <!-- 初始化 -->
      <div
        class="bg-gray-800 border border-gray-700 rounded-xl p-6 mb-6 text-center"
      >
        <button
          onclick="initGame()"
          class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold"
        >
          初始化模擬
        </button>
      </div>

      <!-- 狀態區 -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
          <p class="text-sm text-gray-400">當前天數</p>
          <p id="day" class="text-xl font-bold">-</p>
        </div>

        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
          <p class="text-sm text-gray-400">Cash</p>
          <p id="cash" class="text-xl font-bold text-green-400">-</p>
        </div>

        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
          <p class="text-sm text-gray-400">持倉</p>
          <p id="position" class="text-xl font-bold text-blue-400">-</p>
        </div>

        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
          <p class="text-sm text-gray-400">PnL</p>
          <p id="pnl" class="text-xl font-bold text-purple-400">-</p>
        </div>
      </div>

<!-- 操作區 -->
<div
  class="bg-gray-800 border border-gray-700 rounded-xl p-6 mb-10"
>
  <div class="flex flex-wrap gap-3 justify-center items-center">


    <!-- 股數輸入 -->
    <input
      id="amount"
      type="number"
      min="1"
      placeholder="股數"
      class="px-4 py-3 rounded-lg bg-gray-900 border border-gray-700 w-40"
    />

    <!-- 買入 -->
    <button
      onclick="buy()"
      class="px-6 py-3 bg-green-600 hover:bg-green-500 rounded-lg font-semibold"
    >
      買入
    </button>

    <!-- 賣出 -->
    <button
      onclick="sell()"
      class="px-6 py-3 bg-red-600 hover:bg-red-500 rounded-lg font-semibold"
    >
      賣出
    </button>

    
    <!-- 下一天 -->
    <button
      onclick="nextDay()"
      class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-semibold"
    >
      下一天
    </button>

      </div>

      <!-- 系統價格顯示 -->
      <div class="mt-6 text-center text-gray-300">
        當前價格：
        <span id="current-price" class="text-yellow-400 font-bold">
          --
        </span>
      </div>
    </div>

    <!-- 圖表區 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
        <p class="text-sm text-gray-400 mb-2">K線圖</p>

        <img id="chart" class="rounded-lg w-full" />
      </div>

      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
        <p class="text-sm text-gray-400 mb-2">MACD</p>

        <img id="macd" class="rounded-lg w-full" />
      </div>
    </div>

    <script>
      function render(data) {
        if (!data) return;

        document.getElementById("day").innerText = data.day ?? "-";
        document.getElementById("cash").innerText = data.cash ?? "-";
        document.getElementById("position").innerText = data.stock ?? "-";
        document.getElementById("pnl").innerText = data.pnl ?? "-";
      }

      async function initGame() {
        const res = await fetch("/strategy/gameInit");
        const data = await res.json();

        console.log("init:", data);

        render(data);
      }

      async function nextDay() {
        try {
          const res = await fetch("/strategy/nextDay", {
            method: "GET",
            headers: {
              "Content-Type": "application/json"
            }
          });

          if (!res.ok) {
            console.error("HTTP error:", res.status);
            return;
          }

          const data = await res.json();
          console.log("RAW API PRICE:", data.price);
          console.log("nextDay response:", data);

          // ---- 基本結構檢查 ----
          if (!data || typeof data !== "object") {
            console.error("API 回傳不是物件:", data);
            return;
          }

          if (!("price" in data)) {
            console.error("API 缺少 price 欄位:", data);
            return;
          }

          // ---- 更新 UI（安全寫法）----
          const priceEl = document.getElementById("current-price");
          if (priceEl) {
            priceEl.innerText = Number(data.price).toFixed(2);
          }

          const dayEl = document.getElementById("current-day");
          if (dayEl && data.day !== undefined) {
            dayEl.innerText = data.day;
          }

          const cashEl = document.getElementById("current-cash");
          if (cashEl && data.cash !== undefined) {
            cashEl.innerText = Number(data.cash).toFixed(2);
          }

          // ---- debug ----
          console.log(
            `DAY=${data.day}, PRICE=${data.price}, PNL=${data.pnl}`
          );

        } catch (err) {
          console.error("nextDay failed:", err);
        }
      }

      async function buy() {
        const amount = parseInt(
          document.getElementById("amount").value
        );

        await fetch("/buy", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            amount: amount,
          }),
        });
      }

      async function sell() {
        const amount = parseInt(
          document.getElementById("amount").value
        );

        await fetch("/sell", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            amount: amount,
          }),
        });
      }

      function render(data) {
        if (!data) return;

        document.getElementById("day").innerText = data.day ?? "-";
        document.getElementById("cash").innerText = data.cash ?? "-";
        document.getElementById("position").innerText = data.stock ?? "-";
        document.getElementById("pnl").innerText = data.pnl ?? "-";

        // 🔥 圖片更新（核心）
        const symbol = data.symbol ?? "TSLA";

        document.getElementById("chart").src =
          data.chart + "?t=" + new Date().getTime();

        document.getElementById("macd").src =
          data.macd + "?t=" + new Date().getTime();
      }
    </script>
  </body>
</html>
